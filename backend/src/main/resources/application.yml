spring:
  application:
    name: raisetimeline-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:raisetimeline}
    username: ${DB_USER:raisetimeline}
    password: ${DB_PASSWORD:raisetimeline}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:local-development-secret-key-change-me-please-32bytes-min}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
