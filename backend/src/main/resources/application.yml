spring:
  application:
    name: raisetimeline-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:raisetimeline}
    username: ${DB_USER:raisetimeline}
    password: ${DB_PASSWORD:raisetimeline}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:1209600000}

aws:
  region: ${AWS_REGION:ap-northeast-1}
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME}
    access-key-id: ${AWS_S3_ACCESS_KEY_ID}
    secret-access-key: ${AWS_S3_SECRET_ACCESS_KEY}
    public-base-url: ${AWS_S3_PUBLIC_BASE_URL}
    presign-expiration-seconds: ${AWS_S3_PRESIGN_EXPIRATION_SECONDS:300}
